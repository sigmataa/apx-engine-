name: datagen
on:
  workflow_dispatch:
    inputs:
      minutes:
        description: "minutes of self-play per runner"
        default: "50"
      nodes:
        description: "nodes per move"
        default: "5000"
      shards:
        description: "number of runners"
        default: "20"
      runs_left:
        description: "how many runs to chain (this one included)"
        default: "1"
      deep_nodes:
        description: "nodes for the second, deeper search (0 = off)"
        default: "0"
      deep_pct:
        description: "percent of positions that get the deeper search"
        default: "0"
      moves:
        description: "1 = also save each position's best move (policy-net data)"
        default: "0"
concurrency:
  group: datagen
  cancel-in-progress: false
permissions:
  contents: read
  actions: write
jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.q.outputs.shards }}
    steps:
      - id: q
        run: echo "shards=[$(seq -s, 1 ${{ inputs.shards }})]" >> "$GITHUB_OUTPUT"
  gen:
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.setup.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4
      - name: build
        run: g++ -std=c++20 -O3 -march=native -DNDEBUG -pthread -Isrc tools/datagen.cpp src/chess.cpp src/eval.cpp src/search.cpp src/kpk.cpp -o datagen
      - name: self-play
        run: |
          if [ "${{ inputs.moves || '0' }}" = "1" ]; then export APX_MOVES=1; fi
          ./datagen part $(nproc) $(( ${{ inputs.minutes }} * 60 )) ${{ inputs.nodes }} $(( (GITHUB_RUN_ID % 100000) * 100 + ${{ matrix.shard }} )) ${{ inputs.deep_nodes || '0' }} ${{ inputs.deep_pct || '0' }}
          cat part.*.bin > sp_${{ matrix.shard }}.bin; ls -la sp_${{ matrix.shard }}.bin
          if ls mine.*.bin >/dev/null 2>&1; then cat mine.*.bin > mine_${{ matrix.shard }}.bin; ls -la mine_${{ matrix.shard }}.bin; fi
          if ls moves.*.bin >/dev/null 2>&1; then cat moves.*.bin > moves_${{ matrix.shard }}.bin; ls -la moves_${{ matrix.shard }}.bin; fi
      - uses: actions/upload-artifact@v4
        with:
          name: sp-${{ matrix.shard }}
          path: |
            sp_${{ matrix.shard }}.bin
            mine_${{ matrix.shard }}.bin
            moves_${{ matrix.shard }}.bin
          if-no-files-found: warn
          retention-days: 5
          compression-level: 1
  next:
    needs: gen
    if: always() && inputs.runs_left != '1'
    runs-on: ubuntu-latest
    steps:
      - name: start the next chained run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api repos/${{ github.repository }}/contents/spsa/DATAGEN_STOP >/dev/null 2>&1; then echo "stop file present"; exit 0; fi
          gh workflow run datagen.yml --ref main -R ${{ github.repository }} -f minutes=${{ inputs.minutes }} -f nodes=${{ inputs.nodes }} -f shards=${{ inputs.shards }} -f runs_left=$(( ${{ inputs.runs_left }} - 1 )) -f deep_nodes=${{ inputs.deep_nodes || '0' }} -f deep_pct=${{ inputs.deep_pct || '0' }} -f moves=${{ inputs.moves || '0' }}
