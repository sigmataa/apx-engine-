name: gauntlet
on:
  workflow_dispatch:
    inputs:
      pairs:
        description: "game pairs per shard"
        default: "34"
      opps:
        description: "JSON list of opponents"
        default: '["ethereal","weiss","stash"]'
concurrency:
  group: gauntlet
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  play:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        opp: ${{ fromJSON(inputs.opps) }}
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4
      - name: build Apx and opponent (pinned commits used for all earlier gauntlets)
        run: |
          F="-std=c++20 -O3 -march=native -DNDEBUG -pthread"
          (cd src && g++ $F *.cpp -o ../apx) & g++ $F -Isrc tools/match2.cpp src/chess.cpp -o match2 &
          case ${{ matrix.opp }} in
            ethereal) git clone -q https://github.com/AndyGrant/Ethereal opp && (P=$(command -v llvm-profdata || ls /usr/bin/llvm-profdata-* 2>/dev/null | tail -1); [ -n "$P" ] || { sudo apt-get install -y -qq llvm >/dev/null; P=$(command -v llvm-profdata); }; cd opp && git checkout -q 0e47e9b67f345c75eb965d9fb3e2493b6a11d09a && cd src && make -s PGOMERGE="$P merge -output=ethereal.profdata *.profraw" && cp Ethereal ../../oppbin) ;;
            weiss)    git clone -q https://github.com/TerjeKir/weiss opp && (cd opp && git checkout -q c735b8f3d2ddb0cdf42b135a5fb42e21c01f7a3d && cd src && make -s && cp weiss ../../oppbin) ;;
            stash)    git clone -q https://github.com/mhouppin/stash-bot opp && (cd opp && git checkout -q 594435e586a2d98ab29531a8182f4e6fad3949c5 && cd src && make -s && cp stash ../../oppbin) ;;
          esac
          wait; echo uci | ./oppbin | grep -m1 "id name"
      - name: play 10s+0.1s
        run: ./match2 ./apx ./oppbin ${{ inputs.pairs }} 2 10000 100 $(( (GITHUB_RUN_ID % 100000) * 100 + ${{ matrix.shard }} )) | tail -1 | tee shard_${{ matrix.opp }}_${{ matrix.shard }}.txt
      - uses: actions/upload-artifact@v4
        with:
          name: g-${{ matrix.opp }}-${{ matrix.shard }}
          path: shard_${{ matrix.opp }}_${{ matrix.shard }}.txt
  merge:
    needs: play
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: shards
      - run: |
          f=results/gauntlet_run${GITHUB_RUN_NUMBER}.txt; mkdir -p results
          { echo "gauntlet: Apx (src) vs pinned opponents, 10s+0.1s, $(date -u)"
            for o in ethereal weiss stash; do ls shards/g-$o-* >/dev/null 2>&1 || continue; mkdir -p by/$o; cp shards/g-$o-*/*.txt by/$o/ 2>/dev/null; echo "== $o"; python3 tools/merge.py by/$o | head -2; done; } | tee $f
          cat $f >> "$GITHUB_STEP_SUMMARY"
          git config user.name "apx-bot"; git config user.email "apx-bot@users.noreply.github.com"
          git add results && git commit -m "gauntlet result run $GITHUB_RUN_NUMBER" && git pull --rebase && git push
