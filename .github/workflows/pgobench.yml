name: pgobench
on: workflow_dispatch
permissions:
  contents: read
jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: build plain and PGO
        run: |
          F="-std=c++20 -O3 -march=native -DNDEBUG -pthread"
          (cd src && g++ $F *.cpp -o ../eng_plain)
          mkdir pgo && cp src/* pgo/ && cd pgo
          g++ $F -fprofile-generate -fprofile-update=atomic *.cpp -o eng_gen
          (cat ../tools/bench_uci.txt; sleep 60) | timeout 90 ./eng_gen > /dev/null
          g++ $F -fprofile-use -fprofile-correction -Wno-missing-profile *.cpp -o ../eng_pgo
      - name: time both (identical single-thread searches, alternating)
        run: |
          for r in 1 2 3 4 5; do for e in eng_plain eng_pgo; do
            (cat tools/bench_uci.txt; sleep 50) | timeout 70 ./$e | awk -v n=$e -v r=$r '/^info depth/{for(i=1;i<=NF;i++){if($i=="time")t=$(i+1);if($i=="nodes")k=$(i+1)}} /^bestmove/{T+=t;K+=k} END{printf "%s run%d: %d nodes %d ms %.0f knps\n",n,r,K,T,K/T}'
          done; done | tee bench.txt
          for e in eng_plain eng_pgo; do grep "^$e " bench.txt | awk -v n=$e '{split($6,a," ");s+=$6;c++} END{printf "%s mean %.0f knps\n",n,s/c}'; done
